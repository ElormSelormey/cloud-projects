name: Mirror Repository to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab

jobs:
  mirror-to-gitlab:
    name: Sync Branches & Tags to GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full commit history, all remote branches, and tags

      - name: Validate Secrets & Push Mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME || github.actor }}
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY || format('gitlab.com/{0}.git', github.repository) }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is not set in GitHub repository secrets!"
            echo "-------------------------------------------------------------------------"
            echo "To enable automated mirroring, add your GitLab Access Token to GitHub:"
            echo "  1. Generate a token in GitLab with 'write_repository' permission."
            echo "  2. Go to GitHub repo -> Settings -> Secrets and variables -> Actions"
            echo "  3. Add secret: GITLAB_TOKEN = <your-token>"
            echo "  (Optional) GITLAB_REPOSITORY = gitlab.com/<username>/<repo>.git"
            echo "-------------------------------------------------------------------------"
            exit 1
          fi

          # Clean up URL format
          CLEAN_URL=$(echo "$GITLAB_REPOSITORY" | sed -e 's|^https://||' -e 's|^http://||')
          TARGET_REMOTE="https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${CLEAN_URL}"

          echo "Configuring target remote..."
          git remote add gitlab "$TARGET_REMOTE"

          echo "Pushing all branches to GitLab..."
          git push gitlab "+refs/remotes/origin/*:refs/heads/*" --prune

          echo "Pushing all tags to GitLab..."
          git push gitlab --tags

          echo "Repository successfully synchronized to GitLab!"
